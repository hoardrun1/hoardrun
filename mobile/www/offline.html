<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hoardrun</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #000; color: #f5f5f7; text-align: center;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    }
    main { max-width: 320px; }
    img { width: 56px; height: 56px; margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    p { color: #a1a1a6; margin: 0 0 28px; }
    button {
      width: 100%; height: 48px; border: 0; border-radius: 12px; background: #2f6bff; color: #fff;
      font: inherit; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="">
    <h1>You're offline</h1>
    <p>Hoardrun needs a connection to show your money. Your balances are safe.</p>
    <button type="button" onclick="location.replace(window.HOARDRUN_URL || '/')">Try again</button>
  </main>
  <script src="app-url.js"></script>
  <script>
    // Retry automatically when the connection comes back
    window.addEventListener('online', function () { location.replace(window.HOARDRUN_URL || '/') })
  </script>
</body>
</html>
